apply plugin: 'com.android.application'

android {
    namespace = "online.geddo.sahrah"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "online.geddo.sahrah"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Codemagic sets BUILD_NUMBER: every store build gets a higher code
        // Codemagic's build number + 100 (10 Nov 2026: Play had already used 8, a code can never be reused; +100 keeps every build above all old uploads)
        // 1.7: never below 110 (1.6 went out as 109 = build 9 + 100); 1.8: never below 111 (1.7 used 110 or more)
        versionCode Math.max(111, Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1") + 100)
        versionName "1.9"
        // 1.6: Facebook SDK (install + app-open events for the Meta App Promotion campaign). The app id is public; the client token
        // comes from the Codemagic environment variable FB_CLIENT_TOKEN (never committed)
        resValue "string", "facebook_app_id", "1909940596360916"
        resValue "string", "facebook_client_token", (System.getenv("FB_CLIENT_TOKEN") ?: "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // release signing from Codemagic's keystore (android_signing in codemagic.yaml exposes these variables); local builds stay unsigned
    signingConfigs {
        release {
            if (System.getenv("CM_KEYSTORE_PATH")) {
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("CM_KEYSTORE_PATH")) signingConfig signingConfigs.release
            // 1.7: R8 shrinks and optimises the code and drops unused resources (smaller app, faster start on weak phones).
            // Keep rules for Capacitor, its plugins and the web view's JS bridge are in proguard-rules.pro (+ each library's own
            // consumer rules); res/raw/keep.xml keeps the resources looked up by name. The mapping file goes into the .aab, so
            // Play shows readable crash stacks.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 1.6: the Facebook SDK core only (no login, no UI): it starts by itself and logs installs and app opens (AutoLogAppEvents)
    implementation 'com.facebook.android:facebook-core:17.0.0'
    // 1.7: where the install came from (Google Play Install Referrer), read once on the first launch (InstallSource.java)
    implementation 'com.android.installreferrer:installreferrer:2.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
